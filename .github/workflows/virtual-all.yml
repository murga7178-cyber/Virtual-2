name: Virtual All-in-One APK

# यह अकेली फ़ाइल पूरा ऐप खुद बनाती है (सारा कोड इसी के अंदर है) और APK तैयार करती है।
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install NDK for BlackBox
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "cmake;3.22.1"

    - name: Generate project files
      run: |
        mkdir -p "$GITHUB_WORKSPACE/generated"
        cd "$GITHUB_WORKSPACE/generated"
        mkdir -p "app"
        cat > "app/build.gradle" <<'VAPP_EOF_0'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.virtualapp'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.virtualapp"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_21
                targetCompatibility JavaVersion.VERSION_21
            }
            kotlinOptions { jvmTarget = '21' }
        }

        dependencies {
            // BlackBox core (AAR GitHub Actions workflow इसे app/libs में डालता है)
            implementation fileTree(dir: "libs", include: ["*.aar"])
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.recyclerview:recyclerview:1.3.2'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        VAPP_EOF_0
        mkdir -p "app/src/main"
        cat > "app/src/main/AndroidManifest.xml" <<'VAPP_EOF_1'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:tools="http://schemas.android.com/tools">

            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                tools:ignore="QueryAllPackagesPermission" />
            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:name=".MyApplication"
                android:allowBackup="true"
                android:label="VirtualApp"
                android:supportsRtl="true"
                android:theme="@style/Theme.VirtualApp">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

            </application>
        </manifest>
        VAPP_EOF_1
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/AppInfo.kt" <<'VAPP_EOF_2'
        package com.example.virtualapp

        import android.graphics.drawable.Drawable

        data class AppInfo(
            val name: String,
            val packageName: String,
            val icon: Drawable,
            var isAdded: Boolean = false,
            var fakeAndroidId: String? = null
        )
        VAPP_EOF_2
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/AppListAdapter.kt" <<'VAPP_EOF_3'
        package com.example.virtualapp

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.ImageView
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView

        class AppListAdapter(
            private val apps: List<AppInfo>,
            private val onClick: (AppInfo) -> Unit,
            private val onLongClick: (AppInfo) -> Unit
        ) : RecyclerView.Adapter<AppListAdapter.VH>() {

            class VH(view: View) : RecyclerView.ViewHolder(view) {
                val icon: ImageView = view.findViewById(R.id.appIcon)
                val name: TextView = view.findViewById(R.id.appName)
                val pkg: TextView = view.findViewById(R.id.appPkg)
                val fakeId: TextView = view.findViewById(R.id.fakeIdText)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context)
                    .inflate(R.layout.item_app, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                val app = apps[position]
                holder.icon.setImageDrawable(app.icon)
                holder.name.text = app.name
                holder.pkg.text = app.packageName

                if (app.isAdded && app.fakeAndroidId != null) {
                    holder.fakeId.visibility = View.VISIBLE
                    holder.fakeId.text = "Android ID: ${app.fakeAndroidId}"
                } else {
                    holder.fakeId.visibility = View.GONE
                }

                holder.itemView.setOnClickListener { onClick(app) }
                holder.itemView.setOnLongClickListener {
                    onLongClick(app)
                    true
                }
            }

            override fun getItemCount() = apps.size
        }
        VAPP_EOF_3
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/MainActivity.kt" <<'VAPP_EOF_4'
        package com.example.virtualapp

        import android.app.AlertDialog
        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.content.pm.ApplicationInfo
        import android.content.pm.PackageManager
        import android.os.Bundle
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import com.example.virtualapp.data.FakeIdentity
        import com.example.virtualapp.data.IdentityStore
        import com.google.android.material.floatingactionbutton.FloatingActionButton
        import top.niunaijun.blackbox.BlackBoxCore

        class MainActivity : AppCompatActivity() {

            private val apps = mutableListOf<AppInfo>()
            private lateinit var adapter: AppListAdapter

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                val rv = findViewById<RecyclerView>(R.id.appsRecyclerView)
                adapter = AppListAdapter(
                    apps,
                    onClick = { app -> onAppClicked(app) },
                    onLongClick = { app -> onAppLongClicked(app) }
                )
                rv.layoutManager = LinearLayoutManager(this)
                rv.adapter = adapter

                findViewById<FloatingActionButton>(R.id.fabAdd).setOnClickListener {
                    loadApps()
                    Toast.makeText(this, "लोड हो रहा है... कुल: ${apps.size}", Toast.LENGTH_SHORT).show()
                }

                loadApps()
            }

            private fun loadApps() {
                apps.clear()
                val pm = packageManager

                val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                val list = pm.queryIntentActivities(intent, 0)

                for (ri in list) {
                    val ai = ri.activityInfo.applicationInfo
                    if (ai.packageName != packageName) {
                        addApp(pm, ai)
                    }
                }

                if (apps.isEmpty()) {
                    val allApps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                    for (ai in allApps) {
                        if (ai.packageName != packageName &&
                            pm.getLaunchIntentForPackage(ai.packageName) != null) {
                            addApp(pm, ai)
                        }
                    }
                }

                adapter.notifyDataSetChanged()
            }

            private fun addApp(pm: PackageManager, ai: ApplicationInfo) {
                val existing = IdentityStore.getAll(this)
                    .find { it.packageName == ai.packageName }

                apps.add(
                    AppInfo(
                        name = ai.loadLabel(pm).toString(),
                        packageName = ai.packageName,
                        icon = ai.loadIcon(pm),
                        isAdded = existing != null,
                        fakeAndroidId = existing?.androidId
                    )
                )
            }

            // Tap → पूरी identity दिखाओ
            private fun onAppClicked(app: AppInfo) {
                val identity = IdentityStore.getOrCreate(this, app.packageName)

                app.isAdded = true
                app.fakeAndroidId = identity.androidId
                adapter.notifyDataSetChanged()

                MyApplication.copyApkToVirtual(this, app.packageName)

                showIdentityDialog(app, identity)
            }

            // Tap dialog: सारी fake info दिखाओ + Copy बटन
            private fun showIdentityDialog(app: AppInfo, id: FakeIdentity) {
                val message = """
                    📱 ${app.name}

                    🆔 Android ID: ${id.androidId}

                    📞 IMEI: ${id.imei}

                    📶 WiFi MAC: ${id.wifiMac}

                    🔵 Bluetooth MAC: ${id.bluetoothMac}

                    🌐 WiFi IP: ${id.wifiIp}

                    📡 Mobile IP: ${id.mobileIp}

                    🔢 Serial: ${id.serial}

                    📦 Model: ${id.model}

                    🏢 Brand: ${id.brand}

                    🤖 Android Version: ${id.androidVersion}
                """.trimIndent()

                AlertDialog.Builder(this)
                    .setTitle("Fake Identity")
                    .setMessage(message)
                    .setPositiveButton("Copy") { _, _ ->
                        val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                        clipboard.setPrimaryClip(ClipData.newPlainText("FakeIdentity", message))
                        Toast.makeText(this, "Copy हो गया", Toast.LENGTH_SHORT).show()
                    }
                    .setNeutralButton("वर्चुअल में चलाएँ") { _, _ -> launchVirtual(app) }
                    .setNegativeButton("बंद करें", null)
                    .show()
            }

            // BlackBox के वर्चुअल स्पेस में ऐप इंस्टॉल करके चलाओ
            private fun launchVirtual(app: AppInfo) {
                Toast.makeText(this, "वर्चुअल स्पेस में खोल रहे हैं...", Toast.LENGTH_SHORT).show()
                Thread {
                    try {
                        val userId = MyApplication.VIRTUAL_USER_ID
                        BlackBoxCore.get().installPackageAsUser(app.packageName, userId)
                        BlackBoxCore.get().launchApk(app.packageName, userId)
                    } catch (e: Throwable) {
                        runOnUiThread {
                            Toast.makeText(this, "नहीं खुला: ${e.message}", Toast.LENGTH_LONG).show()
                        }
                    }
                }.start()
            }

            // Long-press → delete
            private fun onAppLongClicked(app: AppInfo) {
                if (!app.isAdded) {
                    Toast.makeText(this, "इस ऐप की ID अभी बनी नहीं है", Toast.LENGTH_SHORT).show()
                    return
                }

                AlertDialog.Builder(this)
                    .setTitle("ID हटाएँ?")
                    .setMessage("${app.name} की fake ID हटा दी जाएगी।\nअगली बार नई ID बनेगी।")
                    .setPositiveButton("हटाएँ") { _, _ ->
                        IdentityStore.delete(this, app.packageName)
                        app.isAdded = false
                        app.fakeAndroidId = null
                        adapter.notifyDataSetChanged()
                        Toast.makeText(this, "ID हटा दी गई", Toast.LENGTH_SHORT).show()
                    }
                    .setNegativeButton("रहने दें", null)
                    .show()
            }
        }
        VAPP_EOF_4
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/MyApplication.kt" <<'VAPP_EOF_5'
        package com.example.virtualapp

        import android.app.Application
        import android.content.Context
        import android.util.Log
        import top.niunaijun.blackbox.BlackBoxCore
        import top.niunaijun.blackbox.app.configuration.ClientConfiguration
        import java.io.File

        class MyApplication : Application() {

            override fun attachBaseContext(base: Context) {
                super.attachBaseContext(base)
                try {
                    BlackBoxCore.get().doAttachBaseContext(base, object : ClientConfiguration() {
                        override fun getHostPackageName(): String = base.packageName
                    })
                } catch (e: Throwable) {
                    Log.e("VirtualApp", "BlackBox attach fail: ${e.message}")
                }
            }

            override fun onCreate() {
                super.onCreate()
                try {
                    BlackBoxCore.get().doCreate()
                } catch (e: Throwable) {
                    Log.e("VirtualApp", "BlackBox create fail: ${e.message}")
                }
                val virtualDir = File(filesDir, "virtual")
                if (!virtualDir.exists()) virtualDir.mkdirs()
                Log.d("VirtualApp", "Virtual dir ready: ${virtualDir.absolutePath}")
            }

            companion object {
                const val VIRTUAL_USER_ID = 0

                fun copyApkToVirtual(context: Context, packageName: String): String? {
                    return try {
                        val src = context.packageManager
                            .getApplicationInfo(packageName, 0).sourceDir
                        val destDir = File(context.filesDir, "virtual/$packageName")
                        if (!destDir.exists()) destDir.mkdirs()
                        val dest = File(destDir, "base.apk")
                        File(src).copyTo(dest, overwrite = true)
                        dest.absolutePath
                    } catch (e: Exception) {
                        Log.e("VirtualApp", "APK copy fail: ${e.message}")
                        null
                    }
                }
            }
        }
        VAPP_EOF_5
        mkdir -p "app/src/main/java/com/example/virtualapp/data"
        cat > "app/src/main/java/com/example/virtualapp/data/FakeIdentity.kt" <<'VAPP_EOF_6'
        package com.example.virtualapp.data

        import android.content.Context

        data class FakeIdentity(
            val packageName: String,
            val androidId: String,
            val imei: String,
            val wifiMac: String,
            val bluetoothMac: String,
            val wifiIp: String,
            val mobileIp: String,
            val serial: String,
            val model: String,
            val brand: String,
            val androidVersion: String,
            val fingerprint: String
        )

        object IdentityStore {

            private const val PREF = "fake_identity_store"

            fun getOrCreate(context: Context, packageName: String): FakeIdentity {
                val prefs = context.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                val existingId = prefs.getString("${packageName}_androidId", null)

                if (existingId != null) {
                    return FakeIdentity(
                        packageName = packageName,
                        androidId = existingId,
                        imei = prefs.getString("${packageName}_imei", "")!!,
                        wifiMac = prefs.getString("${packageName}_wifiMac", "")!!,
                        bluetoothMac = prefs.getString("${packageName}_btMac", "")!!,
                        wifiIp = prefs.getString("${packageName}_wifiIp", "")!!,
                        mobileIp = prefs.getString("${packageName}_mobileIp", "")!!,
                        serial = prefs.getString("${packageName}_serial", "")!!,
                        model = prefs.getString("${packageName}_model", "")!!,
                        brand = prefs.getString("${packageName}_brand", "")!!,
                        androidVersion = prefs.getString("${packageName}_androidVer", "")!!,
                        fingerprint = prefs.getString("${packageName}_fingerprint", "")!!
                    )
                }

                val newIdentity = FakeIdentity(
                    packageName = packageName,
                    androidId = randomHex(16),
                    imei = randomDigits(15),
                    wifiMac = randomMac(),
                    bluetoothMac = randomMac(),
                    wifiIp = randomIp(),
                    mobileIp = randomIp(),
                    serial = randomHex(12).uppercase(),
                    model = "SM-${randomHex(4).uppercase()}",
                    brand = "Samsung",
                    androidVersion = "13",
                    fingerprint = "samsung/${randomHex(6)}/${randomHex(6)}:13/TP1A.220624.014/${randomHex(8)}:user/release-keys"
                )

                prefs.edit()
                    .putString("${packageName}_androidId", newIdentity.androidId)
                    .putString("${packageName}_imei", newIdentity.imei)
                    .putString("${packageName}_wifiMac", newIdentity.wifiMac)
                    .putString("${packageName}_btMac", newIdentity.bluetoothMac)
                    .putString("${packageName}_wifiIp", newIdentity.wifiIp)
                    .putString("${packageName}_mobileIp", newIdentity.mobileIp)
                    .putString("${packageName}_serial", newIdentity.serial)
                    .putString("${packageName}_model", newIdentity.model)
                    .putString("${packageName}_brand", newIdentity.brand)
                    .putString("${packageName}_androidVer", newIdentity.androidVersion)
                    .putString("${packageName}_fingerprint", newIdentity.fingerprint)
                    .apply()

                return newIdentity
            }

            fun getAll(context: Context): List<FakeIdentity> {
                val prefs = context.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                val result = mutableListOf<FakeIdentity>()
                for (key in prefs.all.keys) {
                    if (key.endsWith("_androidId")) {
                        val pkg = key.removeSuffix("_androidId")
                        result.add(getOrCreate(context, pkg))
                    }
                }
                return result
            }

            fun delete(context: Context, packageName: String) {
                val prefs = context.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                prefs.edit()
           
