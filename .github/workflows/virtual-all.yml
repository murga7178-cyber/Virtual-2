name: Virtual All-in-One APK

# यह अकेली फ़ाइल NewBlackbox डाउनलोड करती है, उसमें आपके ऐप का कोड (नीचे इसी फ़ाइल में) डालती है और APK बनाती है।
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install NDK for BlackBox
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "cmake;3.22.1"

    - name: Download NewBlackbox
      run: |
        git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git "$RUNNER_TEMP/bb"

    - name: Patch BlackBox to use our fake IDs
      run: |
        cd "$RUNNER_TEMP/bb/Bcore/src/main/java/top/niunaijun/blackbox/fake/service"
        cat > FakeIds.java <<'VAPP_JAVA_EOF'
        package top.niunaijun.blackbox.fake.service;

        import android.os.Bundle;

        import java.io.BufferedReader;
        import java.io.File;
        import java.io.FileReader;

        import top.niunaijun.blackbox.BlackBoxCore;
        //BACT_IMPORT

        public class FakeIds {
            // अभी चल रहे वर्चुअल ऐप की कुंजी: पैकेज@कॉपी नंबर
            private static String currentKey() {
                String pkg = BActivityThread.getAppPackageName();
                if (pkg == null) return null;
                return pkg + "@" + BActivityThread.getUserId();
            }

            public static String currentImei() {
                return read(currentKey(), 2);
            }

            public static String currentAndroidId() {
                return read(currentKey(), 1);
            }

            // Settings provider की call() का जवाब: android_id माँगा गया तो नकली ID डालो
            public static Object fixSettingsCall(Object[] args, Object result) {
                try {
                    if (args == null || !(result instanceof Bundle)) return result;
                    boolean isAndroidId = false;
                    for (Object a : args) {
                        if ("android_id".equals(a)) {
                            isAndroidId = true;
                            break;
                        }
                    }
                    if (!isAndroidId) return result;
                    String fake = currentAndroidId();
                    if (fake == null) return result;
                    Bundle b = new Bundle((Bundle) result);
                    b.putString("value", fake);
                    return b;
                } catch (Throwable t) {
                    return result;
                }
            }

            private static String read(String key, int col) {
                if (key == null) return null;
                String host = BlackBoxCore.getHostPkg();
                String[] paths = {
                        "/data/data/" + host + "/files/fake_ids.txt",
                        "/data/user/0/" + host + "/files/fake_ids.txt"
                };
                for (String path : paths) {
                    try {
                        File f = new File(path);
                        if (!f.exists()) continue;
                        try (BufferedReader r = new BufferedReader(new FileReader(f))) {
                            String line;
                            while ((line = r.readLine()) != null) {
                                String[] p = line.split("\\|");
                                if (p.length >= 3 && p[0].equals(key)) return p[col];
                            }
                        }
                    } catch (Throwable ignored) {
                    }
                }
                return null;
            }
        }
        VAPP_JAVA_EOF
        IMP=$(grep -h "^import .*\.BActivityThread;" ITelephonyManagerProxy.java | head -1)
        if [ -z "$IMP" ]; then echo "PATCH FAILED: BActivityThread import not found"; exit 1; fi
        sed -i "s|//BACT_IMPORT|$IMP|" FakeIds.java
        python3 - <<'VAPP_PY_EOF'
        import re
        # 1) IMEI / Device ID / Subscriber ID
        p = 'ITelephonyManagerProxy.java'
        s = open(p, encoding='utf-8').read()
        old = 'return Md5Utils.md5(BlackBoxCore.getHostPkg());'
        n = s.count(old)
        if n < 4:
            raise SystemExit('PATCH FAILED: telephony expected at least 4 matches, found %d' % n)
        new = 'String vappId = FakeIds.currentImei(); return vappId != null ? vappId : Md5Utils.md5(BlackBoxCore.getHostPkg());'
        open(p, 'w', encoding='utf-8').write(s.replace(old, new))
        print('telephony patched', n, 'places')
        # 2) Android ID (Settings provider call)
        pat = re.compile(r'public\s+Object\s+invoke\s*\(\s*Object\s+proxy\s*,\s*Method\s+method\s*,\s*Object\[\]\s+args\s*\)\s+throws\s+Throwable\s*\{')
        repl = ('public Object invoke(Object proxy, Method method, Object[] args) throws Throwable {\n'
                '        Object vappResult = vappInvokeOrig(proxy, method, args);\n'
                '        if (method != null && "call".equals(method.getName())) {\n'
                '            return FakeIds.fixSettingsCall(args, vappResult);\n'
                '        }\n'
                '        return vappResult;\n'
                '    }\n\n'
                '    private Object vappInvokeOrig(Object proxy, Method method, Object[] args) throws Throwable {')
        for f in ['context/providers/SystemProviderStub.java', 'context/providers/ContentProviderStub.java']:
            s = open(f, encoding='utf-8').read()
            s2, c = pat.subn(lambda m: repl, s)
            if c != 1:
                raise SystemExit('PATCH FAILED: invoke() in %s found %d times' % (f, c))
            s2 = s2.replace('package top.niunaijun.blackbox.fake.service.context.providers;',
                            'package top.niunaijun.blackbox.fake.service.context.providers;\n\nimport top.niunaijun.blackbox.fake.service.FakeIds;', 1)
            open(f, 'w', encoding='utf-8').write(s2)
            print('android id patched', f)
        VAPP_PY_EOF
        grep -n "vappInvokeOrig\|import .*FakeIds" context/providers/SystemProviderStub.java context/providers/ContentProviderStub.java | head

    - name: Generate our app files
      run: |
        mkdir -p "$RUNNER_TEMP/vapp"
        cd "$RUNNER_TEMP/vapp"
        mkdir -p "app/src/main"
        cat > "app/src/main/AndroidManifest.xml" <<'VAPP_EOF_0'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:tools="http://schemas.android.com/tools">

            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                tools:ignore="QueryAllPackagesPermission" />
            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:name=".MyApplication"
                android:allowBackup="true"
                tools:replace="android:label,android:allowBackup,android:supportsRtl,android:theme"
                android:label="VirtualApp"
                android:supportsRtl="true"
                android:theme="@style/Theme.VirtualApp">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <activity
                    android:name=".LaunchActivity"
                    android:exported="true"
                    android:excludeFromRecents="true"
                    android:taskAffinity=""
                    android:theme="@android:style/Theme.Translucent.NoTitleBar" />

            </application>
        </manifest>
        VAPP_EOF_0
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/AppInfo.kt" <<'VAPP_EOF_1'
        package com.example.virtualapp

        import android.graphics.drawable.Drawable

        data class AppInfo(
            val name: String,
            val packageName: String,
            val icon: Drawable,
            var isAdded: Boolean = false,
            var fakeAndroidId: String? = null,
            var copies: Int = 1
        )
        VAPP_EOF_1
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/AppListAdapter.kt" <<'VAPP_EOF_2'
        package com.example.virtualapp

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.ImageView
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView

        class AppListAdapter(
            private val apps: List<AppInfo>,
            private val onClick: (AppInfo) -> Unit,
            private val onLongClick: (AppInfo) -> Unit
        ) : RecyclerView.Adapter<AppListAdapter.VH>() {

            class VH(view: View) : RecyclerView.ViewHolder(view) {
                val icon: ImageView = view.findViewById(R.id.appIcon)
                val name: TextView = view.findViewById(R.id.appName)
                val pkg: TextView = view.findViewById(R.id.appPkg)
                val fakeId: TextView = view.findViewById(R.id.fakeIdText)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context)
                    .inflate(R.layout.item_app, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                val app = apps[position]
                holder.icon.setImageDrawable(app.icon)
                holder.name.text = app.name
                holder.pkg.text = app.packageName

                holder.fakeId.visibility = View.VISIBLE
                holder.fakeId.text = if (app.isAdded) {
                    val copiesLine = if (app.copies > 1) "📋 कुल कॉपी: ${app.copies}\n" else ""
                    copiesLine + "✅ Android ID और IMEI/डिवाइस ID: नकली लागू (वर्चुअल में चलाने पर)\n⚠️ MAC, IP, Model आदि: असली दिख सकते हैं"
                } else {
                    "⚠️ अभी नकली ID नहीं, असली पहचान दिख सकती है"
                }

                holder.itemView.setOnClickListener { onClick(app) }
                holder.itemView.setOnLongClickListener {
                    onLongClick(app)
                    true
                }
            }

            override fun getItemCount() = apps.size
        }
        VAPP_EOF_2
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/LaunchActivity.kt" <<'VAPP_EOF_3'
        package com.example.virtualapp

        import android.app.Activity
        import android.os.Bundle
        import android.widget.Toast
        import com.example.virtualapp.data.IdentityStore
        import top.niunaijun.blackbox.BlackBoxCore

        // होम स्क्रीन शॉर्टकट से सीधे वर्चुअल ऐप खोलने वाली बिना-स्क्रीन की Activity
        class LaunchActivity : Activity() {

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val pkg = intent.getStringExtra(EXTRA_PKG)
                if (pkg == null) {
                    finish()
                    return
                }
                val userId = intent.getIntExtra(EXTRA_USER, 0)
                val appCtx = applicationContext
                IdentityStore.getOrCreate(appCtx, IdentityStore.key(pkg, userId))
                IdentityStore.syncBridge(appCtx)
                Thread {
                    try {
                        // पहले सीधे खोलने की कोशिश (वर्चुअल कॉपी पहले से हो तो असली ऐप ज़रूरी नहीं)
                        var ok = try {
                            BlackBoxCore.get().launchApk(pkg, userId)
                        } catch (e: Throwable) {
                            false
                        }
                        if (!ok) {
                            BlackBoxCore.get().installPackageAsUser(pkg, userId)
                            ok = BlackBoxCore.get().launchApk(pkg, userId)
                        }
                        if (!ok) {
                            runOnUiThread {
                                Toast.makeText(appCtx, "ऐप नहीं खुल पाया", Toast.LENGTH_LONG).show()
                            }
                        }
                    } catch (e: Throwable) {
                        runOnUiThread {
                            Toast.makeText(
                                appCtx,
                                "नहीं खुला: ${e.javaClass.simpleName}: ${e.message}",
                                Toast.LENGTH_LONG
                            ).show()
                        }
                    }
                    runOnUiThread { finish() }
                }.start()
            }

            companion object {
                const val EXTRA_PKG = "pkg"
                const val EXTRA_USER = "user"
            }
        }
        VAPP_EOF_3
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/MainActivity.kt" <<'VAPP_EOF_4'
        package com.example.virtualapp

        import android.app.AlertDialog
        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.content.pm.ApplicationInfo
        import android.content.pm.PackageManager
        import android.graphics.Bitmap
        import android.graphics.Canvas
        import android.graphics.drawable.Drawable
        import android.os.Bundle
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.pm.ShortcutInfoCompat
        import androidx.core.content.pm.ShortcutManagerCompat
        import androidx.core.graphics.drawable.IconCompat
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import com.example.virtualapp.data.FakeIdentity
        import com.example.virtualapp.data.IdentityStore
        import com.google.android.material.floatingactionbutton.FloatingActionButton
        import top.niunaijun.blackbox.BlackBoxCore

        class MainActivity : AppCompatActivity() {

            private val GMS_PACKAGES = listOf(
                "com.google.android.gms",
                "com.google.android.gsf",
                "com.android.vending"
            )

            private val apps = mutableListOf<AppInfo>()
            private lateinit var adapter: AppListAdapter

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                val rv = findViewById<RecyclerView>(R.id.appsRecyclerView)
                adapter = AppListAdapter(
                    apps,
                    onClick = { app -> onAppClicked(app) },
                    onLongClick = { app -> onAppLongClicked(app) }
                )
                rv.layoutManager = LinearLayoutManager(this)
                rv.adapter = adapter

                findViewById<FloatingActionButton>(R.id.fabAdd).setOnClickListener {
                    loadApps()
                    Toast.makeText(this, "लोड हो रहा है... कुल: ${apps.size}", Toast.LENGTH_SHORT).show()
                }

                IdentityStore.syncBridge(this)
                loadApps()
            }

            private fun loadApps() {
                apps.clear()
                val pm = packageManager

                val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                val list = pm.queryIntentActivities(intent, 0)

                for (ri in list) {
                    val ai = ri.activityInfo.applicationInfo
                    if (ai.packageName != packageName) {
                        addApp(pm, ai)
                    }
                }

                if (apps.isEmpty()) {
                    val allApps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                    for (ai in allApps) {
                        if (ai.packageName != packageName &&
                            pm.getLaunchIntentForPackage(ai.packageName) != null) {
                            addApp(pm, ai)
                        }
                    }
                }

                apps.sortWith(compareByDescending<AppInfo> { it.isAdded }.thenBy { it.name.lowercase() })
                adapter.notifyDataSetChanged()
            }

            private fun addApp(pm: PackageManager, ai: ApplicationInfo) {
                val existing = IdentityStore.getAll(this)
                    .find { it.packageName == ai.packageName }

                apps.add(
                    AppInfo(
                        name = ai.loadLabel(pm).toString(),
                        packageName = ai.packageName,
                        icon = ai.loadIcon(pm),
                        isAdded = existing != null,
                        fakeAndroidId = existing?.androidId,
                        copies = IdentityStore.copyCount(this, ai.packageName)
                    )
                )
            }

            // Tap → विकल्प की सूची
            private fun onAppClicked(app: AppInfo) {
                val identity = IdentityStore.getOrCreate(this, app.packageName)
                app.isAdded = true
                app.fakeAndroidId = identity.androidId
                app.copies = IdentityStore.copyCount(this, app.packageName)
                adapter.notifyDataSetChanged()

                val options = arrayOf(
                    "▶ वर्चुअल में चलाएँ",
                    "➕ दूसरी कॉपी बनाएँ (नई ID के साथ)",
                    "🏠 होम स्क्रीन पर जोड़ें",
                    "🆔 Fake ID देखें",
                    "🧩 Google Play Services जोड़ें (प्रयोग)"
                )
                AlertDialog.Builder(this)
                    .setTitle(app.name)
                    .setItems(options) { _, which ->
                        when (which) {
                            0 -> pickCopy(app) { copy -> launchVirtual(app, copy) }
                            1 -> createCopy(app)
                            2 -> pickCopy(app) { copy -> addHomeShortcut(app, copy) }
                            3 -> pickCopy(app) { copy -> showIdentityDialog(app, copy) }
                            4 -> chooseGmsSpace()
                        }
                    }
                    .setNegativeButton("बंद करें", null)
                    .show()
            }

            // एक से ज़्यादा कॉपी हों तो पूछो कौन-सी
            private fun pickCopy(app: AppInfo, action: (Int) -> Unit) {
                val n = IdentityStore.copyCount(this, app.packageName)
                if (n <= 1) {
                    action(0)
                    return
                }
                val names = Array(n) { "कॉपी ${it + 1}" + if (IdentityStore.hasGms(this, it)) " · GMS ✔" else "" }
                AlertDialog.Builder(this)
                    .setTitle(app.name)
                    .setItems(names) { _, which -> action(which) }
                    .setNegativeButton("बंद करें", null)
                    .show()
            }

            // इसी ऐप की एक और कॉपी: नया वर्चुअल स्पेस + नई ID
            private fun createCopy(app: AppInfo) {
                val copy = IdentityStore.addCopy(this, app.packageName)
                app.copies = copy + 1
                adapter.notifyDataSetChanged()
                Toast.makeText(this, "कॉपी ${copy + 1} बनी, नई ID के साथ", Toast.LENGTH_SHORT).show()
                launchVirtual(app, copy)
            }

            // होम स्क्रीन पर इस कॉपी का शॉर्टकट बनाओ (टैप करने पर सीधे वर्चुअल में खुलेगा)
            private fun addHomeShortcut(app: AppInfo, copy: Int) {
                if (!ShortcutManagerCompat.isRequestPinShortcutSupported(this)) {
                    Toast.makeText(this, "यह फ़ोन का लॉन्चर शॉर्टकट नहीं बनाने देता", Toast.LENGTH_LONG).show()
                    return
                }
                val launchIntent = Intent(this, LaunchActivity::class.java)
                    .setAction(Intent.ACTION_VIEW)
                    .putExtra(LaunchActivity.EXTRA_PKG, app.packageName)
                    .putExtra(LaunchActivity.EXTRA_USER, copy)

                val label = if (copy == 0) app.name else "${app.name} ${copy + 1}"
                val info = ShortcutInfoCompat.Builder(this, "vapp_" + IdentityStore.key(app.packageName, copy))
                    .setShortLabel(label)
                    .setLongLabel(label)
                    .setIcon(IconCompat.createWithBitmap(drawableToBitmap(app.icon)))
                    .setIntent(launchIntent)
                    .build()

                val ok = ShortcutManagerCompat.requestPinShortcut(this, info, null)
                Toast.makeText(
                    this,
                    if (ok) "होम स्क्रीन पर जोड़ने की अनुमति दें" else "शॉर्टकट नहीं बन पाया",
                    Toast.LENGTH_LONG
                ).show()
            }

            private fun drawableToBitmap(d: Drawable): Bitmap {
                val size = 192
                val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                val canvas = Canvas(bmp)
                d.setBounds(0, 0, size, size)
                d.draw(canvas)
                return bmp
            }

            // Tap dialog: सारी fake info दिखाओ + Copy बटन
            private fun showIdentityDialog(app: AppInfo, copy: Int) {
                val id = IdentityStore.getOrCreate(this, IdentityStore.key(app.packageName, copy))
                val message = """
                    📱 ${app.name} (कॉपी ${copy + 1})

                    ✅ वर्चुअल में चलाने पर लागू होती हैं:
                    🆔 Android ID: ${id.androidId}
                    📞 IMEI / Device ID / Subscriber ID: ${id.imei}

                    ⚠️ अभी लागू नहीं (सिर्फ़ बनी हुई):
                    📶 WiFi MAC: ${id.wifiMac}
                    🔵 Bluetooth MAC: ${id.bluetoothMac}
                    🌐 WiFi IP: ${id.wifiIp}
                    📡 Mobile IP: ${id.mobileIp}
                    🔢 Serial: ${id.serial}
                    📦 Model: ${id.model}
                    🏢 Brand: ${id.brand}
                    🤖 Android Version: ${id.androidVersion}
                """.trimIndent()

                AlertDialog.Builder(this)
                    .setTitle("Fake Identity")
                    .setMessage(message)
                    .setPositiveButton("Copy") { _, _ ->
                        val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                        clipboard.setPrimaryClip(ClipData.newPlainText("FakeIdentity", message))
                        Toast.makeText(this, "Copy हो गया", Toast.LENGTH_SHORT).show()
                    }
                    .setNegativeButton("बंद करें", null)
                    .show()
            }

            // BlackBox के वर्चुअल स्पेस (कॉपी नंबर = यूज़र नंबर) में ऐप इंस्टॉल करके चलाओ
            private fun launchVirtual(app: AppInfo, copy: Int) {
                Toast.makeText(this, "वर्चुअल स्पेस में खोल रहे हैं...", Toast.LENGTH_SHORT).show()
                Thread {
                    try {
                        val installed = BlackBoxCore.get().installPackageAsUser(app.packageName, copy)
                        val launched = BlackBoxCore.get().launchApk(app.packageName, copy)
                        runOnUiThread {
                            Toast.makeText(
                                this,
                                "कॉपी ${copy + 1}: install=$installed, launch=$launched",
                                Toast.LENGTH_LONG
                            ).show()
                        }
                    } catch (e: Throwable) {
                        val report = "${e.javaClass.name}: ${e.message}\n\n" +
                            android.util.Log.getStackTraceString(e).take(1800)
                        runOnUiThread { showErrorDialog(report) }
                    }
                }.start()
            }

            // किस वर्चुअल नंबर में Google Play Services जोड़नी है, चुनो
            private fun chooseGmsSpace() {
                val spaces = (apps.maxOfOrNull { it.copies } ?: 1).coerceAtLeast(1)
                val names = Array(spaces) { i ->
                    "वर्चुअल नंबर ${i + 1}" + if (IdentityStore.hasGms(this, i)) "  (GMS जुड़ा ✔)" else ""
                }
                AlertDialog.Builder(this)
                    .setTitle("किस वर्चुअल में Google Play Services जोड़ें?")
                    .setItems(names) { _, which -> confirmGms(which) }
                    .setNegativeButton("बंद करें", null)
                    .show()
            }

            private fun confirmGms(space: Int) {
                AlertDialog.Builder(this)
                    .setTitle("वर्चुअल नंबर ${space + 1}")
                    .setMessage(
                        "फ़ोन की Google Play Services, Services Framework और Play Store इस वर्चुअल नंबर में डालने की कोशिश होगी। " +
                            "यह इस नंबर के सारे ऐप पर लागू होगा।\n\n" +
                            "यह प्रयोग है, चलेगा या नहीं पक्का नहीं। अपना असली ज़रूरी Google खाता यहाँ न डालें।"
                    )
                    .setPositiveButton("जोड़ें") { _, _ -> addGms(space) }
                    .setNegativeButton("रहने दें", null)
                    .show()
            }

            private fun addGms(space: Int) {
                Toast.makeText(this, "Google Play Services जोड़ रहे हैं...", Toast.LENGTH_SHORT).show()
                Thread {
                    val report = StringBuilder()
                    var okCount = 0
                    for (pkg in GMS_PACKAGES) {
                        try {
                            packageManager.getPackageInfo(pkg, 0)
                            val r = BlackBoxCore.get().installPackageAsUser(pkg, space)
                            val (ok, msg) = describeResult(r)
                            when (ok) {
                                true -> {
                                    okCount++
                                    report.append("✅ $pkg\n")
                                }
                                false -> report.append("❌ $pkg: $msg\n")
                                null -> {
                                    okCount++
                                    report.append("❓ $pkg: नतीजा साफ़ नहीं ($msg)\n")
                                }
                            }
                        } catch (e: PackageManager.NameNotFoundException) {
                            report.append("➖ $pkg: फ़ोन में नहीं मिला\n")
                        } catch (e: Throwable) {
                            report.append("❌ $pkg: ${e.javaClass.simpleName}: ${e.message}\n")
                        }
                    }
                    if (okCount > 0) IdentityStore.setGms(this, space, true)
                    val text = report.toString()
                    runOnUiThread {
                        AlertDialog.Builder(this)
                            .setTitle("वर्चुअल नंबर ${space + 1}: नतीजा")
                            .setMessage(text)
                            .setPositiveButton("Copy") { _, _ ->
                                val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                clipboard.setPrimaryClip(ClipData.newPlainText("GmsResult", text))
                                Toast.makeText(this, "Copy हो गया", Toast.LENGTH_SHORT).show()
                            }
                            .setNegativeButton("बंद करें", null)
                            .show()
                        adapter.notifyDataSetChanged()
                    }
                }.start()
            }

            // InstallResult के अंदर success/msg खोजो (BlackBox का क्लास सीधे नहीं बाँधा)
            private fun describeResult(r: Any?): Pair<Boolean?, String> {
                if (r == null) return Pair(null, "")
                return try {
                    val ok = r.javaClass.getField("success").getBoolean(r)
                    val msg = try {
                        r.javaClass.getField("msg").get(r)?.toString() ?: ""
                    } catch (e: Throwable) {
                        ""
                    }
                    Pair(ok, msg)
                } catch (e: Throwable) {
                    Pair(null, r.toString())
                }
            }

            // पूरा एरर दिखाओ + Copy बटन (मुझे भेजने के लिए)
            private fun showErrorDialog(report: String) {
                AlertDialog.Builder(this)
                    .setTitle("वर्चुअल स्पेस एरर")
                    .setMessage(report)
                    .setPositiveButton("Copy") { _, _ ->
                        val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                        clipboard.setPrimaryClip(ClipData.newPlainText("VirtualError", report))
                        Toast.makeText(this, "Copy हो गया", Toast.LENGTH_SHORT).show()
                    }
                    .setNegativeButton("बंद करें", null)
                    .show()
            }

            // Long-press → delete
            private fun onAppLongClicked(app: AppInfo) {
                if (!app.isAdded) {
                    Toast.makeText(this, "इस ऐप की ID अभी बनी नहीं है", Toast.LENGTH_SHORT).show()
                    return
                }

                AlertDialog.Builder(this)
                    .setTitle("ID हटाएँ?")
                    .setMessage("${app.name} की सारी कॉपियों की fake ID हटा दी जाएँगी।\nअगली बार नई ID बनेगी।")
                    .setPositiveButton("हटाएँ") { _, _ ->
                        IdentityStore.deleteAll(this, app.packageName)
                        app.copies = 1
                        app.isAdded = false
                        app.fakeAndroidId = null
                        adapter.notifyDataSetChanged()
                        Toast.makeText(this, "ID हटा दी गई", Toast.LENGTH_SHORT).show()
                    }
                    .setNegativeButton("रहने दें", null)
                    .show()
            }
        }
