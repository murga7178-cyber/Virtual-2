    - name: Put our app inside NewBlackbox
      run: |
        cd "$RUNNER_TEMP/bb"
        echo "---- original app/build.gradle ----"
        cat app/build.gradle
        rm -rf app/src
        mkdir -p app/src
        cp -r "$RUNNER_TEMP/vapp/app/src/main" app/src/main
        sed -i -E "s/(namespace[[:space:]]*=?[[:space:]]*)[\"'][^\"']+[\"']/\1'com.example.virtualapp'/" app/build.gradle
        sed -i -E "s/(applicationId[[:space:]]*=?[[:space:]]*)[\"'][^\"']+[\"']/\1'com.example.virtualapp'/" app/build.gradle
        printf '\ndependencies {\n    implementation "androidx.core:core-ktx:1.12.0"\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.11.0"\n    implementation "androidx.recyclerview:recyclerview:1.3.2"\n}\n' >> app/build.gradle
        echo "---- patched app/build.gradle ----"
        cat app/build.gradle

    - name: Build Debug APK
      shell: bash
      run: |
        cd "$RUNNER_TEMP/bb"
        chmod +x gradlew
        ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
        mkdir -p "$GITHUB_WORKSPACE/out"
        find app/build/outputs/apk/debug -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/out/app-debug.apk" \;
        ls -la "$GITHUB_WORKSPACE/out"

    - name: Show only the real errors
      if: failure()
      run: |
        echo "=========== REAL ERRORS (यही भेजें) ==========="
        grep -n -A4 " Error:" "$RUNNER_TEMP/build.log" | head -60 || true
        echo "=========== MANIFEST MERGER REPORT ==========="
        grep -n -B1 -A3 "ERROR" "$RUNNER_TEMP/bb/app/build/outputs/logs/manifest-merger-debug-report.txt" | head -60 || true
        echo "=========== OUR MANIFEST ==========="
        cat "$RUNNER_TEMP/bb/app/src/main/AndroidManifest.xml"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: out/app-debug.apk
