name: Virtual All-in-One APK

# यह अकेली फ़ाइल NewBlackbox डाउनलोड करती है, उसमें आपके ऐप का कोड (नीचे इसी फ़ाइल में) डालती है और APK बनाती है।
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install NDK for BlackBox
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "cmake;3.22.1"

    - name: Download NewBlackbox
      run: |
        git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git "$RUNNER_TEMP/bb"

    - name: Show settings provider code
      run: |
        cd "$RUNNER_TEMP/bb/Bcore/src/main/java/top/niunaijun/blackbox/fake/service"
        for f in ISettingsProviderProxy.java context/providers/SystemProviderStub.java context/providers/ContentProviderStub.java; do
          echo "=================== $f ==================="
          grep -v -E '^\s*import |^\s*$' "$f" | head -130
        done

    - name: Patch BlackBox to use our fake IDs
      run: |
        cd "$RUNNER_TEMP/bb/Bcore/src/main/java/top/niunaijun/blackbox/fake/service"
        cat > FakeIds.java <<'VAPP_JAVA_EOF'
        package top.niunaijun.blackbox.fake.service;

        import java.io.BufferedReader;
        import java.io.File;
        import java.io.FileReader;

        import top.niunaijun.blackbox.BlackBoxCore;

        public class FakeIds {
            public static String androidId(String pkg) {
                return read(pkg, 1);
            }

            public static String imei(String pkg) {
                return read(pkg, 2);
            }

            private static String read(String pkg, int col) {
                if (pkg == null) return null;
                String host = BlackBoxCore.getHostPkg();
                String[] paths = {
                        "/data/data/" + host + "/files/fake_ids.txt",
                        "/data/user/0/" + host + "/files/fake_ids.txt"
                };
                for (String path : paths) {
                    try {
                        File f = new File(path);
                        if (!f.exists()) continue;
                        try (BufferedReader r = new BufferedReader(new FileReader(f))) {
                            String line;
                            while ((line = r.readLine()) != null) {
                                String[] p = line.split("\\|");
                                if (p.length >= 3 && p[0].equals(pkg)) return p[col];
                            }
                        }
                    } catch (Throwable ignored) {
                    }
                }
                return null;
            }
        }
        VAPP_JAVA_EOF
        python3 - <<'VAPP_PY_EOF'
        p = 'ITelephonyManagerProxy.java'
        s = open(p, encoding='utf-8').read()
        old = 'return Md5Utils.md5(BlackBoxCore.getHostPkg());'
        n = s.count(old)
        if n < 4:
            raise SystemExit('PATCH FAILED: expected at least 4 matches, found %d' % n)
        new = 'String vappId = FakeIds.imei(BActivityThread.getAppPackageName()); return vappId != null ? vappId : Md5Utils.md5(BlackBoxCore.getHostPkg());'
        s = s.replace(old, new)
        open(p, 'w', encoding='utf-8').write(s)
        print('patched', n, 'places')
        VAPP_PY_EOF
        grep -n "vappId" ITelephonyManagerProxy.java | head

    - name: Generate our app files
      run: |
        mkdir -p "$RUNNER_TEMP/vapp"
        cd "$RUNNER_TEMP/vapp"
        mkdir -p "app/src/main"
        cat > "app/src/main/AndroidManifest.xml" <<'VAPP_EOF_0'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:tools="http://schemas.android.com/tools">

            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                tools:ignore="QueryAllPackagesPermission" />
            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:name=".MyApplication"
                android:allowBackup="true"
                tools:replace="android:label,android:allowBackup,android:supportsRtl,android:theme"
                android:label="VirtualApp"
                android:supportsRtl="true"
                android:theme="@style/Theme.VirtualApp">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <activity
                    android:name=".LaunchActivity"
                    android:exported="true"
                    android:excludeFromRecents="true"
                    android:taskAffinity=""
                    android:theme="@android:style/Theme.Translucent.NoTitleBar" />

            </application>
        </manifest>
        VAPP_EOF_0
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/AppInfo.kt" <<'VAPP_EOF_1'
        package com.example.virtualapp

        import android.graphics.drawable.Drawable

        data class AppInfo(
            val name: String,
            val packageName: String,
            val icon: Drawable,
            var isAdded: Boolean = false,
            var fakeAndroidId: String? = null
        )
        VAPP_EOF_1
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/AppListAdapter.kt" <<'VAPP_EOF_2'
        package com.example.virtualapp

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.ImageView
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView

        class AppListAdapter(
            private val apps: List<AppInfo>,
            private val onClick: (AppInfo) -> Unit,
            private val onLongClick: (AppInfo) -> Unit
        ) : RecyclerView.Adapter<AppListAdapter.VH>() {

            class VH(view: View) : RecyclerView.ViewHolder(view) {
                val icon: ImageView = view.findViewById(R.id.appIcon)
                val name: TextView = view.findViewById(R.id.appName)
                val pkg: TextView = view.findViewById(R.id.appPkg)
                val fakeId: TextView = view.findViewById(R.id.fakeIdText)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context)
                    .inflate(R.layout.item_app, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                val app = apps[position]
                holder.icon.setImageDrawable(app.icon)
                holder.name.text = app.name
                holder.pkg.text = app.packageName

                holder.fakeId.visibility = View.VISIBLE
                holder.fakeId.text = if (app.isAdded) {
                    "✅ IMEI/डिवाइस ID: नकली लागू (वर्चुअल में चलाने पर)\n⚠️ Android ID: अभी लागू नहीं, असली दिख सकती है"
                } else {
                    "⚠️ अभी नकली ID नहीं, असली पहचान दिख सकती है"
                }

                holder.itemView.setOnClickListener { onClick(app) }
                holder.itemView.setOnLongClickListener {
                    onLongClick(app)
                    true
                }
            }

            override fun getItemCount() = apps.size
        }
        VAPP_EOF_2
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/LaunchActivity.kt" <<'VAPP_EOF_3'
        package com.example.virtualapp

        import android.app.Activity
        import android.os.Bundle
        import android.widget.Toast
        import com.example.virtualapp.data.IdentityStore
        import top.niunaijun.blackbox.BlackBoxCore

        // होम स्क्रीन शॉर्टकट से सीधे वर्चुअल ऐप खोलने वाली बिना-स्क्रीन की Activity
        class LaunchActivity : Activity() {

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val pkg = intent.getStringExtra(EXTRA_PKG)
                if (pkg == null) {
                    finish()
                    return
                }
                val appCtx = applicationContext
                IdentityStore.getOrCreate(appCtx, pkg)
                IdentityStore.syncBridge(appCtx)
                Thread {
                    try {
                        val userId = MyApplication.VIRTUAL_USER_ID
                        // पहले सीधे खोलने की कोशिश (वर्चुअल कॉपी पहले से हो तो असली ऐप ज़रूरी नहीं)
                        var ok = try {
                            BlackBoxCore.get().launchApk(pkg, userId)
                        } catch (e: Throwable) {
                            false
                        }
                        if (!ok) {
                            BlackBoxCore.get().installPackageAsUser(pkg, userId)
                            ok = BlackBoxCore.get().launchApk(pkg, userId)
                        }
                        if (!ok) {
                            runOnUiThread {
                                Toast.makeText(appCtx, "ऐप नहीं खुल पाया", Toast.LENGTH_LONG).show()
                            }
                        }
                    } catch (e: Throwable) {
                        runOnUiThread {
                            Toast.makeText(
                                appCtx,
                                "नहीं खुला: ${e.javaClass.simpleName}: ${e.message}",
                                Toast.LENGTH_LONG
                            ).show()
                        }
                    }
                    runOnUiThread { finish() }
                }.start()
            }

            companion object {
                const val EXTRA_PKG = "pkg"
            }
        }
        VAPP_EOF_3
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/MainActivity.kt" <<'VAPP_EOF_4'
        package com.example.virtualapp

        import android.app.AlertDialog
        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.content.pm.ApplicationInfo
        import android.content.pm.PackageManager
        import android.graphics.Bitmap
        import android.graphics.Canvas
        import android.graphics.drawable.Drawable
        import android.os.Bundle
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.pm.ShortcutInfoCompat
        import androidx.core.content.pm.ShortcutManagerCompat
        import androidx.core.graphics.drawable.IconCompat
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import com.example.virtualapp.data.FakeIdentity
        import com.example.virtualapp.data.IdentityStore
        import com.google.android.material.floatingactionbutton.FloatingActionButton
        import top.niunaijun.blackbox.BlackBoxCore

        class MainActivity : AppCompatActivity() {

            private val apps = mutableListOf<AppInfo>()
            private lateinit var adapter: AppListAdapter

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                val rv = findViewById<RecyclerView>(R.id.appsRecyclerView)
                adapter = AppListAdapter(
                    apps,
                    onClick = { app -> onAppClicked(app) },
                    onLongClick = { app -> onAppLongClicked(app) }
                )
                rv.layoutManager = LinearLayoutManager(this)
                rv.adapter = adapter

                findViewById<FloatingActionButton>(R.id.fabAdd).setOnClickListener {
                    loadApps()
                    Toast.makeText(this, "लोड हो रहा है... कुल: ${apps.size}", Toast.LENGTH_SHORT).show()
                }

                IdentityStore.syncBridge(this)
                loadApps()
            }

            private fun loadApps() {
                apps.clear()
                val pm = packageManager

                val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                val list = pm.queryIntentActivities(intent, 0)

                for (ri in list) {
                    val ai = ri.activityInfo.applicationInfo
                    if (ai.packageName != packageName) {
                        addApp(pm, ai)
                    }
                }

                if (apps.isEmpty()) {
                    val allApps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                    for (ai in allApps) {
                        if (ai.packageName != packageName &&
                            pm.getLaunchIntentForPackage(ai.packageName) != null) {
                            addApp(pm, ai)
                        }
                    }
                }

                apps.sortWith(compareByDescending<AppInfo> { it.isAdded }.thenBy { it.name.lowercase() })
                adapter.notifyDataSetChanged()
            }

            private fun addApp(pm: PackageManager, ai: ApplicationInfo) {
                val existing = IdentityStore.getAll(this)
                    .find { it.packageName == ai.packageName }

                apps.add(
                    AppInfo(
                        name = ai.loadLabel(pm).toString(),
                        packageName = ai.packageName,
                        icon = ai.loadIcon(pm),
                        isAdded = existing != null,
                        fakeAndroidId = existing?.androidId
                    )
                )
            }

            // Tap → विकल्प की सूची
            private fun onAppClicked(app: AppInfo) {
                val identity = IdentityStore.getOrCreate(this, app.packageName)
                app.isAdded = true
                app.fakeAndroidId = identity.androidId
                adapter.notifyDataSetChanged()

                val options = arrayOf(
                    "▶ वर्चुअल में चलाएँ",
                    "🏠 होम स्क्रीन पर जोड़ें",
                    "🆔 Fake ID देखें"
                )
                AlertDialog.Builder(this)
                    .setTitle(app.name)
                    .setItems(options) { _, which ->
                        when (which) {
                            0 -> launchVirtual(app)
                            1 -> addHomeShortcut(app)
                            2 -> showIdentityDialog(app, identity)
                        }
                    }
                    .setNegativeButton("बंद करें", null)
                    .show()
            }

            // होम स्क्रीन पर इस ऐप का शॉर्टकट बनाओ (टैप करने पर सीधे वर्चुअल में खुलेगा)
            private fun addHomeShortcut(app: AppInfo) {
                if (!ShortcutManagerCompat.isRequestPinShortcutSupported(this)) {
                    Toast.makeText(this, "यह फ़ोन का लॉन्चर शॉर्टकट नहीं बनाने देता", Toast.LENGTH_LONG).show()
                    return
                }
                val launchIntent = Intent(this, LaunchActivity::class.java)
                    .setAction(Intent.ACTION_VIEW)
                    .putExtra(LaunchActivity.EXTRA_PKG, app.packageName)

                val info = ShortcutInfoCompat.Builder(this, "vapp_" + app.packageName)
                    .setShortLabel(app.name)
                    .setLongLabel(app.name)
                    .setIcon(IconCompat.createWithBitmap(drawableToBitmap(app.icon)))
                    .setIntent(launchIntent)
                    .build()

                val ok = ShortcutManagerCompat.requestPinShortcut(this, info, null)
                Toast.makeText(
                    this,
                    if (ok) "होम स्क्रीन पर जोड़ने की अनुमति दें" else "शॉर्टकट नहीं बन पाया",
                    Toast.LENGTH_LONG
                ).show()
            }

            private fun drawableToBitmap(d: Drawable): Bitmap {
                val size = 192
                val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                val canvas = Canvas(bmp)
                d.setBounds(0, 0, size, size)
                d.draw(canvas)
                return bmp
            }

            // Tap dialog: सारी fake info दिखाओ + Copy बटन
            private fun showIdentityDialog(app: AppInfo, id: FakeIdentity) {
                val message = """
                    📱 ${app.name}

                    ✅ वर्चुअल में चलाने पर लागू होती हैं:
                    📞 IMEI / Device ID / Subscriber ID: ${id.imei}

                    ⚠️ अभी लागू नहीं (सिर्फ़ बनी हुई):
                    🆔 Android ID: ${id.androidId}
                    📶 WiFi MAC: ${id.wifiMac}
                    🔵 Bluetooth MAC: ${id.bluetoothMac}
                    🌐 WiFi IP: ${id.wifiIp}
                    📡 Mobile IP: ${id.mobileIp}
                    🔢 Serial: ${id.serial}
                    📦 Model: ${id.model}
                    🏢 Brand: ${id.brand}
                    🤖 Android Version: ${id.androidVersion}
                """.trimIndent()

                AlertDialog.Builder(this)
                    .setTitle("Fake Identity")
                    .setMessage(message)
                    .setPositiveButton("Copy") { _, _ ->
                        val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                        clipboard.setPrimaryClip(ClipData.newPlainText("FakeIdentity", message))
                        Toast.makeText(this, "Copy हो गया", Toast.LENGTH_SHORT).show()
                    }
                    .setNegativeButton("बंद करें", null)
                    .show()
            }

            // BlackBox के वर्चुअल स्पेस में ऐप इंस्टॉल करके चलाओ
            private fun launchVirtual(app: AppInfo) {
                Toast.makeText(this, "वर्चुअल स्पेस में खोल रहे हैं...", Toast.LENGTH_SHORT).show()
                Thread {
                    try {
                        val userId = MyApplication.VIRTUAL_USER_ID
                        val installed = BlackBoxCore.get().installPackageAsUser(app.packageName, userId)
                        val launched = BlackBoxCore.get().launchApk(app.packageName, userId)
                        runOnUiThread {
                            Toast.makeText(
                                this,
                                "install=$installed, launch=$launched",
                                Toast.LENGTH_LONG
                            ).show()
                        }
                    } catch (e: Throwable) {
                        val report = "${e.javaClass.name}: ${e.message}\n\n" +
                            android.util.Log.getStackTraceString(e).take(1800)
                        runOnUiThread { showErrorDialog(report) }
                    }
                }.start()
            }

            // पूरा एरर दिखाओ + Copy बटन (मुझे भेजने के लिए)
            private fun showErrorDialog(report: String) {
                AlertDialog.Builder(this)
                    .setTitle("वर्चुअल स्पेस एरर")
                    .setMessage(report)
                    .setPositiveButton("Copy") { _, _ ->
                        val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                        clipboard.setPrimaryClip(ClipData.newPlainText("VirtualError", report))
                        Toast.makeText(this, "Copy हो गया", Toast.LENGTH_SHORT).show()
                    }
                    .setNegativeButton("बंद करें", null)
                    .show()
            }

            // Long-press → delete
            private fun onAppLongClicked(app: AppInfo) {
                if (!app.isAdded) {
                    Toast.makeText(this, "इस ऐप की ID अभी बनी नहीं है", Toast.LENGTH_SHORT).show()
                    return
                }

                AlertDialog.Builder(this)
                    .setTitle("ID हटाएँ?")
                    .setMessage("${app.name} की fake ID हटा दी जाएगी।\nअगली बार नई ID बनेगी।")
                    .setPositiveButton("हटाएँ") { _, _ ->
                        IdentityStore.delete(this, app.packageName)
                        app.isAdded = false
                        app.fakeAndroidId = null
                        adapter.notifyDataSetChanged()
                        Toast.makeText(this, "ID हटा दी गई", Toast.LENGTH_SHORT).show()
                    }
                    .setNegativeButton("रहने दें", null)
                    .show()
            }
        }
        VAPP_EOF_4
        mkdir -p "app/src/main/java/com/example/virtualapp"
        cat > "app/src/main/java/com/example/virtualapp/MyApplication.kt" <<'VAPP_EOF_5'
        package com.example.virtualapp

        import android.app.Application
        import android.content.Context
        import android.util.Log
        import top.niunaijun.blackbox.BlackBoxCore
        import top.niunaijun.blackbox.app.configuration.ClientConfiguration
        import java.io.File

        class MyApplication : Application() {

            override fun attachBaseContext(base: Context) {
                super.attachBaseContext(base)
                try {
                    BlackBoxCore.get().doAttachBaseContext(base, object : ClientConfiguration() {
                        override fun getHostPackageName(): String = base.packageName
                    })
                } catch (e: Throwable) {
                    Log.e("VirtualApp", "BlackBox attach fail: ${e.message}")
                }
            }

            override fun onCreate() {
                super.onCreate()
                try {
                    BlackBoxCore.get().doCreate()
                } catch (e: Throwable) {
                    Log.e("VirtualApp", "BlackBox create fail: ${e.message}")
                }
                val virtualDir = File(filesDir, "virtual")
                if (!virtualDir.exists()) virtualDir.mkdirs()
                Log.d("VirtualApp", "Virtual dir ready: ${virtualDir.absolutePath}")
            }

            companion object {
                const val VIRTUAL_USER_ID = 0

                fun copyApkToVirtual(context: Context, packageName: String): String? {
                    return try {
                        val src = context.packageManager
                            .getApplicationInfo(packageName, 0).sourceDir
                        val destDir = File(context.filesDir, "virtual/$packageName")
                        if (!destDir.exists()) destDir.mkdirs()
                        val dest = File(destDir, "base.apk")
                        File(src).copyTo(dest, overwrite = true)
                        dest.absolutePath
                    } catch (e: Exception) {
                        Log.e("VirtualApp", "APK copy fail: ${e.message}")
                        null
                    }
                }
            }
        }
        VAPP_EOF_5
        mkdir -p "app/src/main/java/com/example/virtualapp/data"
        cat > "app/src/main/java/com/example/virtualapp/data/FakeIdentity.kt" <<'VAPP_EOF_6'
        package com.example.virtualapp.data

        import android.content.Context
        import android.util.Log
        import java.io.File

        data class FakeIdentity(
            val packageName: String,
            val androidId: String,
            val imei: String,
            val wifiMac: String,
            val bluetoothMac: String,
            val wifiIp: String,
            val mobileIp: String,
            val serial: String,
            val model: String,
            val brand: String,
            val androidVersion: String,
            val fingerprint: String
        )

        object IdentityStore {

            private const val PREF = "fake_identity_store"

            fun getOrCreate(context: Context, packageName: String): FakeIdentity {
                val prefs = context.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                val existingId = prefs.getString("${packageName}_androidId", null)

                if (existingId != null) {
                    return FakeIdentity(
                        packageName = packageName,
                        androidId = existingId,
                        imei = prefs.getString("${packageName}_imei", "")!!,
                        wifiMac = prefs.getString("${packageName}_wifiMac", "")!!,
                        bluetoothMac = prefs.getString("${packageName}_btMac", "")!!,
                        wifiIp = prefs.getString("${packageName}_wifiIp", "")!!,
                        mobileIp = prefs.getString("${packageName}_mobileIp", "")!!,
                        serial = prefs.getString("${packageName}_serial", "")!!,
                        model = prefs.getString("${packageName}_model", "")!!,
                        brand = prefs.getString("${packageName}_brand", "")!!,
                        androidVersion = prefs.getString("${packageName}_androidVer", "")!!,
                        fingerprint = prefs.getString("${packageName}_fingerprint", "")!!
                    )
                }

                val newIdentity = FakeIdentity(
                    packageName = packageName,
                    androidId = randomHex(16),
                    imei = randomImei(),
                    wifiMac = randomMac(),
                    bluetoothMac = randomMac(),
                    wifiIp = randomIp(),
                    mobileIp = randomIp(),
                    serial = randomHex(12).uppercase(),
                    model = "SM-${randomHex(4).uppercase()}",
                    brand = "Samsung",
                    androidVersion = "13",
                    fingerprint = "samsung/${randomHex(6)}/${randomHex(6)}:13/TP1A.220624.014/${randomHex(8)}:user/release-keys"
                )

                prefs.edit()
                    .putString("${packageName}_androidId", newIdentity.androidId)
                    .putString("${packageName}_imei", newIdentity.imei)
                    .putString("${packageName}_wifiMac", newIdentity.wifiMac)
                    .putString("${packageName}_btMac", newIdentity.bluetoothMac)
                    .putString("${packageName}_wifiIp", newIdentity.wifiIp)
                    .putString("${packageName}_mobileIp", newIdentity.mobileIp)
                    .putString("${packageName}_serial", newIdentity.serial)
                    .putString("${packageName}_model", newIdentity.model)
                    .putString("${packageName}_brand", newIdentity.brand)
                    .putString("${packageName}_androidVer", newIdentity.androidVersion)
                    .putString("${packageName}_fingerprint", newIdentity.fingerprint)
                    .apply()

                syncBridge(context)
                return newIdentity
            }

            // BlackBox के वर्चुअल प्रोसेस इस फ़ाइल से हर ऐप की नकली ID पढ़ते हैं
            // हर लाइन: पैकेज|androidId|imei
            fun syncBridge(context: Context) {
                try {
                    val prefs = context.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                    val sb = StringBuilder()
                    for (key in prefs.all.keys) {
                        if (key.endsWith("_androidId")) {
                            val pkg = key.removeSuffix("_androidId")
                            val aid = prefs.getString(key, "") ?: ""
                            val imei = prefs.getString("${pkg}_imei", "") ?: ""
                            if (aid.isNotEmpty() && imei.isNotEmpty()) {
                                sb.append(pkg).append('|').append(aid).append('|').append(imei).append('\n')
                            }
                        }
                    }
                    File(context.filesDir, "fake_ids.txt").writeText(sb.toString())
                } catch (e: Exception) {
                    Log.e("IdentityStore", "bridge sync fail: ${e.message}")
                }
            }

            fun getAll(context: Context): List<FakeIdentity> {
                val prefs = context.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                val result = mutableListOf<FakeIdentity>()
                for (key in prefs.all.keys) {
                    if (key.endsWith("_androidId")) {
                        val pkg = key.removeSuffix("_androidId")
                        result.add(getOrCreate(context, pkg))
                    }
                }
                return result
            }

            fun delete(context: Context, packageName: String) {
                val prefs = context.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                prefs.edit()
                    .remove("${packageName}_androidId")
                    .remove("${packageName}_imei")
                    .remove("${packageName}_wifiMac")
                    .remove("${packageName}_btMac")
                    .remove("${packageName}_wifiIp")
                    .remove("${packageName}_mobileIp")
                    .remove("${packageName}_serial")
                    .remove("${packageName}_model")
                    .remove("${packageName}_brand")
                    .remove("${packageName}_androidVer")
                    .remove("${packageName}_fingerprint")
                    .apply()
                syncBridge(context)
            }

            private fun randomHex(len: Int): String {
                val chars = "0123456789abcdef"
                return (1..len).map { chars.random() }.joinToString("")
            }

            // 15 अंकों का IMEI जिसका Luhn चेक सही हो
            private fun randomImei(): String {
                val d = IntArray(14) { (0..9).random() }
                d[0] = 3
                d[1] = 5
                var sum = 0
                for (i in 0 until 14) {
                    var x = d[i]
                    if (i % 2 == 1) {
                        x *= 2
                        if (x > 9) x -= 9
                    }
                    sum += x
                }
                val check = (10 - sum % 10) % 10
                return d.joinToString("") + check
            }

            private fun randomDigits(len: Int): String {
                return (1..len).map { (0..9).random().toString() }.joinToString("")
            }

            private fun randomMac(): String {
                val chars = "0123456789ABCDEF"
                return (1..6).joinToString(":") {
                    "${chars.random()}${chars.random()}"
                }
            }

            private fun randomIp(): String {
                return "${(1..223).random()}.${(0..255).random()}.${(0..255).random()}.${(1..254).random()}"
            }
        }
